spring.application.name=backend

# Perfil ativo padrao para desenvolvimento local
spring.profiles.active=local

# Configuracao de Conexao com o Banco de Dados (MySQL)
# Variaveis de ambiente podem sobrescrever os valores padrao
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:trilha_mais}
spring.datasource.username=${DB_USERNAME:postgresql}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracoes do JPA / Hibernate
# 'update': cria ou atualiza as tabelas automaticamente de acordo com as entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Configuracoes de Autenticacao JWT (JSON Web Token)
jwt.secret=${JWT_SECRET:9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Configuracoes de Inteligencia Artificial (Groq Cloud - Gratuita)
groq.api.key=${GROQ_API_KEY:}
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}